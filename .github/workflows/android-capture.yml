name: Build ClassNotes Capture APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-capture/**"
      - ".github/workflows/android-capture.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android-capture
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassNotes-Capture
          path: android-capture/app/build/outputs/apk/debug/app-debug.apk
